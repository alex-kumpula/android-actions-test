name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]


# YAML anchors for setup steps to reduce duplication
defaults: &defaults
  - uses: actions/checkout@v3
  - name: Set up JDK 21
    uses: actions/setup-java@v3
    with:
      java-version: '21'
      distribution: 'temurin'
      cache: gradle
  - name: Cache Gradle dependencies
    uses: actions/cache@v4
    with:
      path: |
        ~/.gradle/caches
        ~/.gradle/wrapper
      key: gradle-${{ runner.os }}-${{ hashFiles('src/**/*.gradle*', 'src/**/gradle-wrapper.properties') }}
      restore-keys: |
        gradle-${{ runner.os }}-
  - name: Grant execute permission for gradlew
    run: chmod +x gradlew
    working-directory: src

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      <<: *defaults
      - name: Test with Gradle
        run: ./gradlew test
        working-directory: src
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: src/app/build/reports/tests/testDebugUnitTest/
    continue-on-error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      <<: *defaults
      - name: Build with Gradle
        run: ./gradlew assembleDebug
        working-directory: src
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: src/app/build/outputs/apk/debug/app-debug.apk