name: Generate Javadoc

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - 'src/doc/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate_javadoc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for creating branches/PRs

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: src

      - name: Build with Gradle
        run: ./gradlew build --parallel
        working-directory: src

      - name: Generate Javadoc
        run: ./gradlew generateReleaseJavadoc
        working-directory: src

      - name: Move generated docs to tracked location
        run: |
          mkdir -p src/doc/javadoc
          cp -r src/doc/javadoc/release/* src/doc/javadoc/ || true

      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B docs/${{ github.ref_name }}
          git add src/doc/javadoc
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          git commit -m "Update generated Javadoc for ${{ github.ref_name }}"
          git push -f origin docs/${{ github.ref_name }}

      - name: Create or update Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Update generated Javadoc for ${{ github.ref_name }}"
          body: |
            This pull request contains the latest generated Javadoc for **${{ github.ref_name }}**.
          base: ${{ github.ref_name }}
          branch: docs/${{ github.ref_name }}
          commit-message: "Update generated Javadoc for ${{ github.ref_name }}"
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
