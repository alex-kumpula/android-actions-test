name: Generate Javadoc

on:
  push:
    # Trigger on push to any branch
    branches: [ "**" ]
    # Ignore pushes that only change documentation (to prevent re-running unnecessarily)
    paths-ignore:
      - 'src/doc/**'

# Define a variable for the output folder name based on the branch name
env:
  DOCS_SUBDIR: ${{ github.ref_name }} # e.g., 'main', 'develop', or 'feature/xyz'

jobs:
  build_javadoc:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: src

      - name: Build with Gradle
        run: ./gradlew build --parallel
        working-directory: src

      - name: Generate Javadoc
        run: ./gradlew generateReleaseJavadoc
        working-directory: src

      - name: Locate and Move generated docs to artifact location (Subfolder)
        # FIX: Using the explicit destinationDir from build.gradle.kts: "$rootDir/doc/javadoc/"
        run: |
          # Source is doc/javadoc/ relative to repository root
          SOURCE_DIR="src/doc/javadoc"
          TARGET_DIR="javadoc-output/${{ env.DOCS_SUBDIR }}"
          
          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ERROR: Javadoc output directory '$SOURCE_DIR' not found."
            echo "Please ensure the Gradle task 'generateReleaseJavadoc' successfully runs."
            exit 1
          fi
          
          echo "Found Javadoc directory: $SOURCE_DIR"
          
          # 2. Create the target path: <artifact-root>/<branch-name>/
          mkdir -p "$TARGET_DIR"
          
          # 3. Copy Javadoc CONTENTS from the located directory to the target subfolder
          cp -r "$SOURCE_DIR"/* "$TARGET_DIR"/
          echo "Successfully copied Javadoc from $SOURCE_DIR to $TARGET_DIR"

      - name: Upload Generated Javadoc Artifact
        # The artifact will contain the branch folder, e.g., javadoc-output/main/index.html
        uses: actions/upload-artifact@v4
        with:
          name: javadoc-files
          path: javadoc-output/
          retention-days: 1
  
  deploy_to_pages:
    name: Deploy to GitHub Pages
    needs: build_javadoc 
    runs-on: ubuntu-latest
    
    # CRITICAL: Need write permission for the GITHUB_TOKEN to push to the gh-pages branch
    permissions:
      contents: write 
      pages: write 
      id-token: write 

    steps:
      - name: Download CURRENT Generated Javadoc Artifact
        uses: actions/download-artifact@v4
        with:
          name: javadoc-files
          path: . # Download the javadoc-output/ folder to the root of the runner

      # NEW: We must check out the gh-pages branch here to ensure the previous docs are present
      # for the rsync operation before deployment. We must handle the case where it doesn't exist.
      - name: Checkout existing gh-pages content (if it exists)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: deploy-temp
          # The token needs to be able to fetch branches.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Do not fail if the gh-pages branch does not exist (first run)
          fetch-depth: 0 
        continue-on-error: true # CRITICAL: Allows the workflow to continue if 'gh-pages' is not found

      - name: Merge New Branch Documentation with Existing Pages
        run: |
          # If the deploy-temp folder from checkout exists AND it contains files,
          # copy its contents to the javadoc-output directory to preserve old docs.
          if [ -d "deploy-temp" ] && [ "$(ls -A deploy-temp)" ]; then
            echo "Merging existing gh-pages content with new documentation..."
            # Use rsync to copy the contents, preserving the directory structure.
            # The '-a' (archive) flag preserves permissions and is recursive.
            rsync -av deploy-temp/ javadoc-output/
            rm -rf deploy-temp
          else
            echo "No existing gh-pages branch content found. Deploying new documentation only."
          fi

      - name: Deploy Javadoc to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The directory to deploy now contains ALL branch documentation:
          publish_dir: ./javadoc-output
          publish_branch: gh-pages
          # IMPORTANT: Setting force_orphan to true ensures that peaceiris/actions-gh-pages 
          # will not delete existing documentation folders that weren't included in the current build.
          # This is necessary since we merged the old docs into javadoc-output/
          force_orphan: false