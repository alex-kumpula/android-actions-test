name: Generate Javadoc

on:
  push:
    # Trigger on push to any branch
    branches: [ "**" ]
    # Ignore pushes that only change documentation (to prevent re-running unnecessarily)
    paths-ignore:
      - 'src/doc/**'

# Define a variable for the output folder name based on the branch name
env:
  DOCS_SUBDIR: ${{ github.ref_name }} # e.g., 'main', 'develop', or 'feature/xyz'

jobs:
  build_javadoc:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: src

      - name: Build with Gradle
        run: ./gradlew build --parallel
        working-directory: src

      - name: Generate Javadoc
        run: ./gradlew generateReleaseJavadoc
        working-directory: src

      - name: Move generated docs to artifact location (Subfolder)
        # FIX: Changed source path from src/doc/javadoc/release/ 
        # to the standard Gradle output path: src/build/docs/javadoc/release/
        run: |
          # Create the path: <artifact-root>/<branch-name>/
          mkdir -p javadoc-output/${{ env.DOCS_SUBDIR }}
          # Copy Javadoc CONTENTS from the correct Gradle build folder
          cp -r src/build/docs/javadoc/release/* javadoc-output/${{ env.DOCS_SUBDIR }}/

      - name: Upload Generated Javadoc Artifact
        # The artifact will contain the branch folder, e.g., javadoc-output/main/index.html
        uses: actions/upload-artifact@v4
        with:
          name: javadoc-files
          path: javadoc-output/
          retention-days: 1