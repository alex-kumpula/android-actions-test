name: Generate Javadoc

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - 'src/doc/**'

jobs:
  generate_javadoc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: src

    - name: Build with Gradle
      run: ./gradlew build --parallel
      working-directory: src

    - name: Generate Javadoc
      run: ./gradlew generateReleaseJavadoc
      working-directory: src

    - name: Upload Javadoc options file
      uses: actions/upload-artifact@v4
      with:
        name: javadoc-options
        path: src/app/build/tmp/generateJavadoc/javadoc.options

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v4
      with:
        add-paths: src/doc/javadoc
        body: Automated Update Javadocs
        branch: docs-update-javadoc
        commit-message: "docs: update javadocs"
        delete-branch: true
        title: "Docs: Update Javadocs"