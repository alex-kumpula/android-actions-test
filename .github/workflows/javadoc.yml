name: Generate Javadoc

on:
  push:
    # Trigger on push to any branch
    branches: [ "**" ]
    # Ignore pushes that only change documentation (to prevent re-running unnecessarily)
    paths-ignore:
      - 'src/doc/**'

# The contents:write and pull-requests:write permissions are no longer needed
# when only uploading an artifact. We will remove them.

jobs:
  generate_javadoc:
    runs-on: ubuntu-latest
    
    # We only need read permission for checkout, which is the default, 
    # but we can explicitly set it for clarity if the repository defaults to restricted.
    permissions:
      contents: read # Only read access is required for checkout and build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: src

      - name: Build with Gradle
        run: ./gradlew build --parallel
        working-directory: src

      - name: Generate Javadoc
        run: ./gradlew generateReleaseJavadoc
        working-directory: src

      - name: Move generated docs to artifact location
        # This step consolidates the output files into the directory we will upload.
        # Assuming generateReleaseJavadoc output is in 'src/doc/javadoc/release'
        run: |
          # Create the target directory if it doesn't exist
          mkdir -p src/doc/javadoc
          # Move contents from the release folder to the main javadoc folder
          cp -r src/doc/javadoc/release/* src/doc/javadoc/

      - name: Upload Generated Javadoc Artifact
        uses: actions/upload-artifact@v4
        with:
          name: javadoc-${{ github.ref_name }} # Creates a unique name for the artifact
          path: src/doc/javadoc/
          retention-days: 90 # Optional: How long to keep the artifact (default is 90)
