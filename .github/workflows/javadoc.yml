name: Generate Javadoc and Deploy to Pages

on:
  push:
    # Trigger on push to any branch
    branches: [ "**" ]
    # Ignore pushes that only change documentation (to prevent re-running unnecessarily)
    paths-ignore:
      - 'src/doc/**'

# Define a variable for the output folder name based on the branch name
env:
  # e.g., 'main', 'develop', or 'feature/xyz'. Used as the subfolder on gh-pages.
  DOCS_SUBDIR: ${{ github.ref_name }} 

jobs:
  generate_and_deploy_javadoc:
    runs-on: ubuntu-latest
    
    # CRITICAL: Need write permission for the GITHUB_TOKEN to push to the gh-pages branch
    permissions:
      contents: write 
      pages: write 
      id-token: write 

    steps:
      # 1. CHECKOUT SOURCE CODE
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        # We need the full history for the second checkout of gh-pages to work reliably
        with:
          fetch-depth: 0 

      # 2. BUILD JAVADOC
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: src

      - name: Build with Gradle
        run: ./gradlew build --parallel
        working-directory: src

      - name: Generate Javadoc
        run: ./gradlew generateReleaseJavadoc
        working-directory: src

      # 3. STAGE NEW DOCS
      - name: Stage Newly Generated Javadoc
        run: |
          # Source is src/doc/javadoc/ relative to repository root
          SOURCE_DIR="src/doc/javadoc"
          # Stash the new docs in a temporary folder under the required subpath
          STAGING_DIR="NEW_DOCS_STAGING/${{ env.DOCS_SUBDIR }}"
          
          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ERROR: Javadoc output directory '$SOURCE_DIR' not found. Check Gradle build output."
            exit 1
          fi
          
          echo "Staging new Javadoc for ${{ env.DOCS_SUBDIR }}."
          mkdir -p "$STAGING_DIR"
          # Copy contents of Javadoc into the branch-specific staging folder
          cp -r "$SOURCE_DIR"/* "$STAGING_DIR"/
          
          # Clean up the original output directory to avoid confusion
          rm -rf "$SOURCE_DIR"

      # 4. CHECKOUT EXISTING GH-PAGES CONTENT
      - name: Checkout Existing gh-pages Content (If Exists)
        uses: actions/checkout@v4
        with:
          # Check out gh-pages into the root of the workspace. This wipes the source code, 
          # but we don't need it anymore. We only need the gh-pages docs.
          ref: gh-pages
          path: .
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # CRITICAL: Allows the workflow to proceed if 'gh-pages' is not found (first run)
        
      # 5. MERGE STAGED DOCS
      - name: Merge New Javadoc with Existing Pages Content
        run: |
          NEW_DOCS_ROOT="NEW_DOCS_STAGING"

          if [ -d "$NEW_DOCS_ROOT" ]; then
            echo "Merging staged documentation into deployment root."
            # Use rsync to copy the entire contents of the staging folder 
            # (which includes the branch subfolder) into the current directory (which contains gh-pages content).
            rsync -av "$NEW_DOCS_ROOT"/ .
            rm -rf "$NEW_DOCS_ROOT"
          else
            echo "Staging directory not found. Something went wrong in step 3."
            # Note: The deployment step might still run, but with the content of gh-pages branch.
          fi

      # 6. DEPLOY
      - name: Deploy Javadoc to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The entire working directory is now the content to publish.
          publish_dir: .
          publish_branch: gh-pages
          # Essential for preserving docs for branches not built in this run.
          force_orphan: false
